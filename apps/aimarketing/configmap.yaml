# Non-secret settings only. Edit values here; Argo CD will sync them.
# Secrets (API keys, passwords, JWT) live in Secret aimarketing-secrets — see secrets/README.md
#
# Hostnames use nip.io (free DNS → EIP) because Google OAuth rejects bare IPs.
# Later: buy a domain in Route 53 and replace these hosts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimarketing-config
  namespace: aimarketing
data:
  # --- public URLs (nip.io → 43.204.166.111, Ingress on :80) ---
  FRONTEND_PUBLIC_URL: "http://app.43.204.166.111.nip.io"
  PUBLIC_API_BASE: "http://api.43.204.166.111.nip.io"
  CORS_ORIGINS: "http://app.43.204.166.111.nip.io,http://43.204.166.111:30080"
  NEXTAUTH_URL: "http://app.43.204.166.111.nip.io"

  # --- app behaviour ---
  APP_ENV: "production"
  AUTH_ALLOW_DEV_HEADERS: "0"
  AUTH_TRUST_HOST: "true"
  AGENT_MOCK_MODE: "0"

  # --- service discovery (in-cluster) ---
  API_REWRITE_TARGET: "http://backend:8000"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_USER: "aimarketing"
  POSTGRES_DB: "aimarketing"

  # --- scheduler ---
  SCHEDULER_INTERVAL_SEC: "300"
  API_BASE: "http://backend:8000"

  # --- S3 ---
  S3_BUCKET: "aimarketing-media"
  S3_REGION: "ap-south-1"
  S3_PRESIGN_EXPIRES: "3600"
  S3_ENDPOINT: ""

  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_ID: ""
  META_APP_ID: ""
