# Non-secret settings only.
# Google OAuth rejects bare IPs — use nip.io hostnames (free DNS → EIP).
# Traefik is not installed on this node yet, so we keep NodePorts :30080 / :30800.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimarketing-config
  namespace: aimarketing
data:
  FRONTEND_PUBLIC_URL: "http://app.43.204.166.111.nip.io:30080"
  PUBLIC_API_BASE: "http://api.43.204.166.111.nip.io:30800"
  CORS_ORIGINS: "http://app.43.204.166.111.nip.io:30080,http://43.204.166.111:30080"
  NEXTAUTH_URL: "http://app.43.204.166.111.nip.io:30080"

  APP_ENV: "production"
  AUTH_ALLOW_DEV_HEADERS: "0"
  AUTH_TRUST_HOST: "true"
  AGENT_MOCK_MODE: "0"

  API_REWRITE_TARGET: "http://backend:8000"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_USER: "aimarketing"
  POSTGRES_DB: "aimarketing"

  SCHEDULER_INTERVAL_SEC: "300"
  API_BASE: "http://backend:8000"

  S3_BUCKET: "aimarketing-media"
  S3_REGION: "ap-south-1"
  S3_PRESIGN_EXPIRES: "3600"
  S3_ENDPOINT: ""

  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_ID: ""
  META_APP_ID: ""
