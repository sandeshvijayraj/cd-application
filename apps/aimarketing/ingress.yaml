# Optional: needs Traefik/nginx. Until then use NodePorts + AWS public DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aimarketing
  namespace: aimarketing
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ec2-43-204-166-111.ap-south-1.compute.amazonaws.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
