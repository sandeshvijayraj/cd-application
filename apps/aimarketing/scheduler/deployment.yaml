apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: aimarketing
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: scheduler
          image: 788612735038.dkr.ecr.ap-south-1.amazonaws.com/aimarketing-scheduler:v0.1.95
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: aimarketing-secrets
            - configMapRef:
                name: aimarketing-config
          volumeMounts:
            - name: secrets-files
              mountPath: /etc/aimarketing/secrets
              readOnly: true
      volumes:
        - name: secrets-files
          secret:
            secretName: aimarketing-secrets
            optional: true
