apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aimarketing
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: backend
          image: 788612735038.dkr.ecr.ap-south-1.amazonaws.com/aimarketing-backend:v0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aimarketing-config
            - secretRef:
                name: aimarketing-secrets
          volumeMounts:
            - name: secrets-files
              mountPath: /etc/aimarketing/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: secrets-files
          secret:
            secretName: aimarketing-secrets
            optional: true
