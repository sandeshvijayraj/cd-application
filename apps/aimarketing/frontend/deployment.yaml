apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aimarketing
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: frontend
          image: 788612735038.dkr.ecr.ap-south-1.amazonaws.com/\1:v0.1.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: aimarketing-config
            - secretRef:
                name: aimarketing-secrets
          volumeMounts:
            - name: secrets-files
              mountPath: /etc/aimarketing/secrets
              readOnly: true
      volumes:
        - name: secrets-files
          secret:
            secretName: aimarketing-secrets
            optional: true
