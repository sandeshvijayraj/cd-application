apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aimarketing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sandeshvijayraj/cd-application.git
    targetRevision: main
    path: apps/aimarketing
  destination:
    server: https://kubernetes.default.svc
    namespace: aimarketing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
  # Secrets are NOT in Git — ignore if missing so sync still works until you create them
  ignoreDifferences: []
